name: Build Play Store AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check secrets
        run: |
          for v in KEYSTORE_BASE64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "Secret missing: $v (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm install @capgo/capacitor-native-biometric@^8 || echo "biometric plugin not available - PIN lock will be used"
      - run: |
          mkdir -p www
          cp index.html offline.html manifest.json sw.js logo.svg www/
      - name: Bundle web files (no remote URL) for Play Store
        run: node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('capacitor.config.json'));delete c.server;fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: python3 -m pip install --break-system-packages pillow
      - run: python3 scripts/make_icons.py
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign AAB
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cp android/app/build/outputs/bundle/release/app-release.aab VText.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" VText.aab "$KEY_ALIAS"
          jarsigner -verify VText.aab | tail -2
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: VText-aab
          path: VText.aab

name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html manifest.json sw.js logo.svg www/
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: python3 -m pip install --break-system-packages pillow
      - run: python3 scripts/make_icons.py
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk VText.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VText-apk
          path: VText.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: VText APK ${{ github.run_number }}
          files: VText.apk

    e.onclick=()=>msgMenu(x);box.appendChild(e)});
  if(!n)box.innerHTML='<div class="empty">Abhi koi message nahi. Hi bolo 👋<br><small>Messages khud delete ho jaate hain (Settings me time badlo).</small></div>';
  if(keep)box.scrollTop=box.scrollHeight;
}
function msgMenu(x){const r=[['↩️ Reply',()=>{reply={n:x.fromName||'User',t:prev(x)};rp();$('txt').focus()}]];
  if(x.text)r.push(['📋 Copy',()=>navigator.clipboard&&navigator.clipboard.writeText(x.text)]);
  if(x.from===me.uid)r.push(['🗑 Sabke liye delete',()=>col2().doc(x.id).delete().catch(e=>alert(e.message))]);sheet(r)}
function rp(){const b=$('rp');if(!reply){b.style.display='none';return}b.style.display='block';b.textContent='↩ '+reply.n+': '+reply.t+'   ✕';b.onclick=()=>{reply=null;rp()}}
function vplayer(u){const v=document.createElement('video');v.src=u;v.controls=true;v.playsInline=true;return v}
async function loadVid(id,m,b){
  b.textContent='Load ho raha hai…';
  try{const s=await db.collection(`chats/${cur.id}/messages/${id}/parts`).orderBy('i').get();
    if(s.size!==m.parts)throw Error('x');
    const arr=s.docs.map(x=>Uint8Array.from(atob(x.data().d),c=>c.charCodeAt(0)));
    vids.set(id,URL.createObjectURL(new Blob(arr,{type:m.mime||'video/mp4'})));renderM();
  }catch(e){b.textContent='Video load nahi hua'}
}
$('back').onclick=()=>{$('app').classList.remove('open');unsubM&&unsubM();unsubS&&unsubS();unsubM=unsubS=null;cur=null;renderList()};
$('hd').onclick=()=>{if(!cur)return;if(cur.type==='group')sheet([['👥 '+cur.name]].concat(Object.values(cur.names).map(n=>['• '+n])));else if(peer)sheet([['👤 '+title(cur)],['@'+peer.username],['About: '+(peer.about||'—')]])};
$('cm').onclick=()=>cur&&sheet([['ℹ️ Info',()=>$('hd').onclick()],['🧹 Chat khali karo (sirf mere liye)',()=>{put('clr_'+cur.id,Date.now());renderM()}],['⬅️ Chat band karo',()=>$('back').onclick()]]);
async function post(x,p,ref){const c=cur;ref=ref||col2().doc();const b={from:me.uid,fromName:me.name,ts:SV(),expireAt:x.exp||ex(),...x};delete b.exp;if(reply)b.reply=reply;reply=null;rp();await ref.set(b);db.doc('chats/'+c.id).update({last:p,lastTs:SV(),lastFrom:me.uid}).catch(()=>{})}
const mic=()=>{if(!rec){$('snd').textContent=$('txt').value.trim()?'➤':'🎤'}};
async function sendT(){const t=$('txt').value.trim();if(!t||!cur)return;$('txt').value='';mic();try{await post({type:'text',text:t.slice(0,2000)},t.slice(0,40))}catch(e){alert('Message nahi gaya: '+e.message)}}
async function recT(){
  if(rec){rec.stop();return}
  if(!cur)return;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(s,{audioBitsPerSecond:24000});rec=r;chunks=[];
    r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=async()=>{clearTimeout(rt);s.getTracks().forEach(t=>t.stop());const bl=new Blob(chunks,{type:r.mimeType});rec=null;$('snd').classList.remove('rc');mic();
      if(!bl.size)return;const d=await new Promise(z=>{const f=new FileReader();f.onload=()=>z(f.result);f.readAsDataURL(bl)});
      if(d.length>900000)return alert('Voice bahut lambi hai');st('Voice bhej rahe hain…');try{await post({type:'aud',data:d},'🎤 Voice')}catch(e){alert(e.message)}st('')};
    r.start();$('snd').textContent='⏹';$('snd').classList.add('rc');rt=setTimeout(()=>rec&&rec.stop(),60000);
  }catch(e){alert('Mic permission nahi mili')}
}
$('snd').onclick=()=>$('txt').value.trim()?sendT():recT();
$('txt').oninput=mic;$('txt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&get('enter','1')==='1'){e.preventDefault();sendT()}};
$('emo').innerHTML='😀 😂 🤣 😍 🥰 😘 😊 😉 😎 🤔 😢 😭 😡 😱 🙄 😴 🥳 😇 🤗 😜 👍 👎 🙏 👏 🙌 💪 🤝 👋 ✌️ 👀 🔥 ✨ ❤️ 💔 🎉 🎂 🎁 🌹'.split(' ').map(e=>'<span>'+e+'</span>').join('');
$('emo').onclick=e=>{if(e.target.tagName==='SPAN'){$('txt').value+=e.target.textContent;mic()}};
$('eb').onclick=()=>{const e=$('emo');e.style.display=e.style.display==='flex'?'none':'flex'};
function compress(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  let k=Math.min(1,1000/Math.max(im.width,im.height)),w=im.width*k,h=im.height*k,q=.75,o;const cv=document.createElement('canvas');
  for(let t=0;t<6;t++){cv.width=Math.round(w);cv.height=Math.round(h);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);o=cv.toDataURL('image/jpeg',q);if(o.length<800000)break;w*=.8;h*=.8;q-=.08}
  o.length<900000?res(o):rej(Error('Photo bahut badi hai'))};im.onerror=()=>rej(Error('Photo padh nahi paye'));im.src=URL.createObjectURL(f)})}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!cur)return;
  try{
    if(f.type.startsWith('image/')){st('Photo bhej rahe hain…');await post({type:'img',data:await compress(f)},'📷 Photo')}
    else if(f.type.startsWith('video/')){
      if(f.size>MAXV)return alert('Video 3MB se chhota rakho (lagbhag 10-15 second)');
      st('Video bhej rahe hain…');
      const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
      const b64=url.split(',')[1],n=Math.ceil(b64.length/PART),ref=col2().doc(),xp=ex();
      for(let i=0;i<n;i++)await ref.collection('parts').doc('p'+i).set({i,d:b64.slice(i*PART,(i+1)*PART),expireAt:xp});
      await post({type:'vid',parts:n,mime:f.type||'video/mp4',exp:xp},'🎥 Video',ref);
    }else alert('Sirf photo ya video bhej sakte hain');
  }catch(err){alert('Nahi gaya: '+err.message)}
  st('');
};
function openSet(){$('sn').value=me.name;$('sa').value=me.about||'';$('su').textContent='@'+me.username;av($('sav'),me.name);
  $('th').value=get('theme','auto');$('fs').value=get('fs','16');$('ex').value=get('exp','86400000');$('en').checked=get('enter','1')==='1';$('nt').checked=get('notif','0')==='1';$('set').style.display='flex'}
$('sx').onclick=()=>$('set').style.display='none';
$('th').onchange=e=>{put('theme',e.target.value);look()};$('fs').onchange=e=>{put('fs',e.target.value);look()};
$('ex').onchange=e=>put('exp',e.target.value);$('en').onchange=e=>put('enter',e.target.checked?'1':'0');
$('nt').onchange=e=>{if(!e.target.checked||!window.Notification){put('notif','0');return}Notification.requestPermission().then(p=>{put('notif',p==='granted'?'1':'0');$('nt').checked=p==='granted'})};
$('ss').onclick=async()=>{const name=$('sn').value.trim();if(!name)return alert('Naam likho');
  try{await db.doc('users/'+me.uid).set({name,about:$('sa').value.trim()},{merge:true});
    const b=db.batch();chats.forEach(c=>b.update(db.doc('chats/'+c.id),{['names.'+me.uid]:name}));await b.commit();alert('Profile save ho gaya ✅')}catch(e){alert(e.message)}};
}

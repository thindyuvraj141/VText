async function recT(){

    r.ondataavailable=e=>chunks.push(e.data);

      if(!bl.size)return;const d=await new Promise(z=>{const f=new FileReader();f.onload=()=>z(f.result);f.readAsDataURL(bl)});

function compress(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  let k=Math.min(1,1000/Math.max(im.width,im.height)),w=im.width*k,h=im.height*k,q=.75,o;const cv=document.createElement('canvas');
  for(let t=0;t<6;t++){cv.width=Math.round(w);cv.height=Math.round(h);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);o=cv.toDataURL('image/jpeg',q);if(o.length<800000)break;w*=.8;h*=.8;q-=.08}
  o.length<900000?res(o):rej(Error('Photo is too large'))};im.onerror=()=>rej(Error('Couldn’t read the photo'));im.src=URL.createObjectURL(f)})}
$('file').onchange=async e=>{

    if(f.type.startsWith('image/')){st('Sending photo…');await post({type:'img',data:await compress(f)},'📷 Photo')}
    else if(f.type.startsWith('video/')){
      if(f.size>MAXV)return toast('Video must be under 3 MB (about 10-15 seconds)');
      st('Sending video…');
      const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
      const b64=url.split(',')[1],n=Math.ceil(b64.length/PART),ref=col2().doc(),xp=ex();
      for(let i=0;i<n;i++)await ref.collection('parts').doc('p'+i).set({i,d:b64.slice(i*PART,(i+1)*PART),expireAt:xp});
      await post({type:'vid',parts:n,mime:f.type||'video/mp4',exp:xp},'🎥 Video',ref);
    }else{if(f.size>600000)return toast('Document must be under 600 KB');st('Sending document…');const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});await post({type:'doc',data:d,fname:f.name.slice(0,80),size:f.size},'📄 '+f.name.slice(0,30))}
  }catch(err){toast('Failed: '+err.message)}
  st('');
};
